    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap');
      body {
        font-family: 'Source Sans 3', sans-serif;
        /* Default to light mode background in CSS, let Tailwind handle dark class */
        background-color: #f8fafc;
        color: #0f172a;
        transition: background-color 0.3s ease, color 0.3s ease;

      .dark body {

      /* Custom scrollbar global */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 9999px;
      }

      /* Custom scrollbar para widgets e containers: Invisível no repouso, visível no hover */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
        transition: scrollbar-color 0.2s ease;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: transparent;
        border-radius: 9999px;
        transition: background-color 0.2s ease;
      }

      /* Revela a barra suavemente quando o mouse estiver sobre o elemento ou card */
      .custom-scrollbar:hover,
      .group:hover .custom-scrollbar,
      .hover-scrollbar:hover {
        scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
      }
      .custom-scrollbar:hover::-webkit-scrollbar-thumb,
      .group:hover .custom-scrollbar::-webkit-scrollbar-thumb,
      .hover-scrollbar:hover::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.4);
      }
      .dark .custom-scrollbar:hover,
      .dark .group:hover .custom-scrollbar,
      .dark .hover-scrollbar:hover {
        scrollbar-color: rgba(100, 116, 139, 0.5) transparent;
      }
      .dark .custom-scrollbar:hover::-webkit-scrollbar-thumb,
      .dark .group:hover .custom-scrollbar::-webkit-scrollbar-thumb,
      .dark .hover-scrollbar:hover::-webkit-scrollbar-thumb {
        background-color: rgba(100, 116, 139, 0.5);
      }

      /* Destaque quando o cursor estiver interagindo diretamente no thumb */
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(99, 102, 241, 0.6) !important;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(129, 140, 248, 0.6) !important;
      }

      /* Custom CSS Tooltips */
      .tooltip-container {
        position: relative;
      }
      .tooltip-content {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(-8px);
        background-color: #1e293b;
        color: #f8fafc;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 9999;
        pointer-events: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Tooltip para baixo (usado em headers) */
      .tooltip-bottom .tooltip-content {
        bottom: auto;
        top: 100%;
        transform: translateX(-50%) translateY(8px);
      }

      .tooltip-container:hover .tooltip-content {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(-12px);
      }
      
      .tooltip-bottom:hover .tooltip-content {
        transform: translateX(-50%) translateY(12px);
      }

      /* Triângulos dos tooltips */
      .tooltip-content::after {
        content: '';
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border-width: 5px;
        border-style: solid;
        pointer-events: none;
      }
      
      /* Triângulo para cima (tooltip padrão) */
      .tooltip-container:not(.tooltip-bottom) .tooltip-content::after {
        top: 100%;
        border-color: #1e293b transparent transparent transparent;
      }
      
      /* Triângulo para baixo (tooltip-bottom) */
      .tooltip-bottom .tooltip-content::after {
        bottom: 100%;
        border-color: transparent transparent #1e293b transparent;
      }

      /* Alinhamentos horizontais para evitar cortes nas bordas */
      .tooltip-left .tooltip-content {
        left: 0;
        transform: translateY(8px);
      }
      .tooltip-left.tooltip-bottom:hover .tooltip-content {
        transform: translateY(12px);
      }
      .tooltip-left:not(.tooltip-bottom):hover .tooltip-content {
        transform: translateY(-12px);
      }
      .tooltip-left .tooltip-content::after {
        left: 16px;
        transform: none;
      }

      .tooltip-right .tooltip-content {
        left: auto;
        right: 0;
        transform: translateY(8px);
      }
      .tooltip-right.tooltip-bottom:hover .tooltip-content {
        transform: translateY(12px);
      }
      .tooltip-right:not(.tooltip-bottom):hover .tooltip-content {
        transform: translateY(-12px);
      }
      .tooltip-right .tooltip-content::after {
        left: auto;
        right: 16px;
        transform: none;
      }
      /* Animações Premium sugeridas */
      @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-20px); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }
      
      @keyframes bounce-slow {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
      }
      .animate-bounce-slow { animation: bounce-slow 4s ease-in-out infinite; }

      /* Ajuste de scroll suave */
      html { scroll-behavior: smooth; }
